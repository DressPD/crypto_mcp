[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-mcp"
version = "0.1.0"
description = "Multi-exchange MCP server for crypto market data and safe trading actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.3.4",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
crypto-mcp = "crypto_mcp.main:main"
crypto-mcp-server = "crypto_mcp.mcp_server:main"
crypto-mcp-agent = "crypto_mcp.agent_main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --cov=crypto_mcp --cov-branch --cov-report=term-missing --cov-fail-under=90"
